<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ChatLive</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #efeae2;
    }

    .chat-page {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }


    /* =========================
       HEADER
    ========================= */

    .chat-header {
      height: 65px;

      background: #075E54;
      color: white;

      display: flex;
      align-items: center;

      padding: 7px 10px;

      gap: 9px;

      flex-shrink: 0;
    }


    .back-btn {
      color: white;

      text-decoration: none;

      font-size: 32px;

      padding: 3px;
    }


    #friendPhoto {
      width: 45px;
      height: 45px;

      border-radius: 50%;

      object-fit: cover;

      background: #ddd;

      flex-shrink: 0;
    }


    .friend-info {
      flex: 1;

      min-width: 0;
    }


    #friendName {
      font-size: 20px;

      font-weight: bold;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    #friendStatus {
      font-size: 12px;

      margin-top: 2px;
    }


    /* =========================
       3 DOT MENU
    ========================= */

    .header-menu {
      position: relative;

      flex-shrink: 0;
    }


    #menuBtn {
      width: 40px;
      height: 48px;

      background: transparent;

      border: none;

      color: white;

      font-size: 30px;

      line-height: 1;

      padding: 0;

      cursor: pointer;
    }


    .chat-menu {
      display: none;

      position: absolute;

      right: 0;

      top: 50px;

      width: 190px;

      background: white;

      border-radius: 8px;

      box-shadow:
        0 3px 12px rgba(0,0,0,.25);

      overflow: hidden;

      z-index: 9999;
    }


    .chat-menu.show {
      display: block;
    }


    .chat-menu button {
      width: 100%;

      border: none;

      background: white;

      color: #222;

      text-align: left;

      padding: 14px 15px;

      font-size: 15px;

      cursor: pointer;
    }


    .chat-menu button:active {
      background: #eeeeee;
    }


    /* =========================
       MESSAGES
    ========================= */

    #messages {
      flex: 1;

      overflow-y: auto;

      padding: 10px;

      background: #efeae2;

      display: flex;

      flex-direction: column;
    }


    .message-box {
      max-width: 78%;

      padding: 8px 10px;

      margin: 4px 0;

      border-radius: 12px;

      font-size: 17px;

      word-break: break-word;

      box-shadow:
        0 1px 2px rgba(0,0,0,.15);
    }


    .my-message {
      align-self: flex-end;

      background: #d9fdd3;

      border-bottom-right-radius: 3px;
    }


    .friend-message {
      align-self: flex-start;

      background: white;

      border-bottom-left-radius: 3px;
    }


    .message-image {
      width: 100%;

      max-width: 300px;

      border-radius: 10px;

      display: block;
    }


    .message-bottom {
      text-align: right;

      font-size: 10px;

      color: #777;

      margin-top: 4px;
    }


    .ticks {
      font-size: 12px;

      margin-left: 3px;
    }


    /* =========================
       MESSAGE INPUT
    ========================= */

    .composer {
      min-height: 70px;

      background: white;

      display: flex;

      align-items: center;

      gap: 8px;

      padding: 8px 10px;

      border-top: 1px solid #ddd;
    }


    .camera-btn {
      width: 52px;

      height: 52px;

      border-radius: 50%;

      background: #075E54;

      color: white;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 27px;

      flex-shrink: 0;

      cursor: pointer;
    }


    #message {
      flex: 1;

      height: 52px;

      border: 1px solid #ddd;

      border-radius: 28px;

      padding: 0 17px;

      font-size: 17px;

      outline: none;

      min-width: 0;
    }


    #message:focus {
      border-color: #075E54;
    }


    #sendBtn {
      width: 58px;

      height: 58px;

      border: none;

      border-radius: 50%;

      background: #128CDB;

      color: white;

      font-size: 27px;

      cursor: pointer;

      flex-shrink: 0;
    }


    #sendBtn:disabled {
      opacity: .5;

      cursor: default;
    }

  </style>

</head>


<body>


<div class="chat-page">


  <!-- =========================
       HEADER
  ========================= -->

  <div class="chat-header">


    <a
      href="chat.html"
      class="back-btn"
    >
      ←
    </a>


    <img
      id="friendPhoto"
      src="https://via.placeholder.com/100"
      alt=""
    >


    <div class="friend-info">

      <div id="friendName">
        Loading...
      </div>

      <div id="friendStatus">
        Checking...
      </div>

    </div>
<button
  id="menuBtn"
  type="button"
  style="
    background:none;
    border:none;
    color:white;
    font-size:30px;
    padding:5px 10px;
  "
>
  ⋮
</button>


    <!-- =====================
         3 DOT
    ====================== -->

    <div class="header-menu">

      <button
        id="menuBtn"
        type="button"
      >
        ⋮
      </button>


      <div
        id="chatMenu"
        class="chat-menu"
      >

        <button
          type="button"
          id="searchBtn"
        >
          🔍 Search
        </button>


        <button
          type="button"
          id="mediaBtn"
        >
          🖼️ Media
        </button>


        <button
          type="button"
          id="muteBtn"
        >
          🔕 Mute notifications
        </button>


        <button
          type="button"
          id="clearChatBtn"
        >
          🗑️ Clear chat
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       MESSAGES
  ========================= -->

  <div id="messages"></div>


  <!-- =========================
       COMPOSER
  ========================= -->

  <div class="composer">


    <label
      for="chatPhoto"
      class="camera-btn"
    >
      📷
    </label>


    <input
      type="file"
      id="chatPhoto"
      accept="image/*"
      style="display:none;"
    >


    <input
      type="text"
      id="message"
      placeholder="Type a message..."
      autocomplete="off"
    >


    <button
      id="sendBtn"
      type="button"
    >
      ➤
    </button>


  </div>


</div>


<!-- =========================
     JAVASCRIPT
========================= -->

<script
  type="module"
  src="./conversation.js"
></script>


<script>

  // =========================
  // 3 DOT MENU
  // =========================

  const menuBtn =
    document.getElementById("menuBtn");

  const chatMenu =
    document.getElementById("chatMenu");


  if (menuBtn && chatMenu) {

    menuBtn.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

        chatMenu.classList.toggle(
          "show"
        );

      }
    );


    document.addEventListener(
      "click",
      function() {

        chatMenu.classList.remove(
          "show"
        );

      }
    );

  }


  // =========================
  // MENU BUTTONS
  // =========================

  const searchBtn =
    document.getElementById("searchBtn");

  const mediaBtn =
    document.getElementById("mediaBtn");

  const muteBtn =
    document.getElementById("muteBtn");

  const clearChatBtn =
    document.getElementById("clearChatBtn");


  if (searchBtn) {

    searchBtn.addEventListener(
      "click",
      function() {

        alert(
          "Search feature next step me banayenge."
        );

      }
    );

  }


  if (mediaBtn) {

    mediaBtn.addEventListener(
      "click",
      function() {

        alert(
          "Media feature next step me banayenge."
        );

      }
    );

  }


  if (muteBtn) {

    muteBtn.addEventListener(
      "click",
      function() {

        alert(
          "Mute feature next step me banayenge."
        );

      }
    );

  }


  if (clearChatBtn) {

    clearChatBtn.addEventListener(
      "click",
      function() {

        const confirmDelete =
          confirm(
            "Kya aap chat clear karna chahte ho?"
          );


        if (confirmDelete) {

          alert(
            "Clear chat feature next step me banayenge."
          );

        }

      }
    );

  }

</script>


</body>

</html>
