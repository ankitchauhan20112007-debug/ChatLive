<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ChatLive Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #efeae2;
    }

    .chat-header {
      height: 65px;
      background: #075e54;
      color: white;
      display: flex;
      align-items: center;
      padding: 8px 10px;
      gap: 10px;
    }

    .back-btn {
      color: white;
      text-decoration: none;
      font-size: 28px;
    }

    #friendPhoto {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
    }

    .friend-info {
      flex: 1;
      min-width: 0;
    }

    #friendName {
      font-size: 17px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #friendStatus {
      font-size: 12px;
      margin-top: 3px;
      color: #ddd;
    }

    #menuBtn {
      border: none;
      background: transparent;
      color: white;
      font-size: 27px;
      cursor: pointer;
    }

    .menu {
      display: none;
      position: absolute;
      right: 10px;
      top: 58px;
      background: white;
      width: 170px;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0,0,0,.25);
      overflow: hidden;
      z-index: 20;
    }

    .menu.show {
      display: block;
    }

    .menu button {
      width: 100%;
      border: none;
      background: white;
      padding: 13px;
      text-align: left;
      font-size: 15px;
      cursor: pointer;
    }

    .menu button:active {
      background: #eee;
    }

    #searchBox {
      display: none;
      background: white;
      padding: 8px;
      border-bottom: 1px solid #ddd;
    }

    #searchInput {
      width: 100%;
      height: 40px;
      border: 1px solid #ccc;
      border-radius: 20px;
      padding: 0 15px;
      font-size: 16px;
      outline: none;
    }

    #messages {
      height: calc(100vh - 125px);
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .message-box {
      max-width: 78%;
      padding: 8px 10px 5px;
      border-radius: 10px;
      font-size: 15px;
      word-wrap: break-word;
    }

    .my-message {
      align-self: flex-end;
      background: #dcf8c6;
      border-top-right-radius: 3px;
    }

    .friend-message {
      align-self: flex-start;
      background: white;
      border-top-left-radius: 3px;
    }

    .message-bottom {
      text-align: right;
      font-size: 10px;
      color: #777;
      margin-top: 4px;
    }

    .ticks {
      font-size: 13px;
      margin-left: 4px;
    }

    .message-image {
      max-width: 220px;
      max-height: 300px;
      border-radius: 8px;
      display: block;
      margin-top: 3px;
    }

    .composer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px;
    }

    .camera-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      cursor: pointer;
    }

    #chatPhoto {
      display: none;
    }

    #message {
      flex: 1;
      height: 42px;
      border: none;
      border-radius: 22px;
      padding: 0 15px;
      font-size: 16px;
      outline: none;
    }

    #sendBtn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: #128c7e;
      color: white;
      font-size: 23px;
      cursor: pointer;
    }

    #sendBtn:disabled {
      opacity: .5;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="chat-header">

    <a href="chat.html" class="back-btn">‹</a>

    <img
      id="friendPhoto"
      src="https://via.placeholder.com/60"
      alt="Profile"
    >

    <div class="friend-info">
      <div id="friendName">Loading...</div>
      <div id="friendStatus">Checking...</div>
    </div>

    <button id="menuBtn">⋮</button>

    <div id="chatMenu" class="menu">

      <button id="searchBtn">
        🔍 Search
      </button>

      <button id="mediaBtn">
        🖼️ Media
      </button>

      <button id="muteBtn">
        🔕 Mute
      </button>

      <button id="clearChatBtn">
        🗑️ Clear Chat
      </button>

    </div>

  </div>

  <!-- Search -->
  <div id="searchBox">

    <input
      type="text"
      id="searchInput"
      placeholder="Search messages..."
    >

  </div>

  <!-- Messages -->
  <div id="messages"></div>

  <!-- Composer -->
  <div class="composer">

    <label
      for="chatPhoto"
      class="camera-btn"
    >
      📷
    </label>

    <input
      type="file"
      id="chatPhoto"
      accept="image/*"
    >

    <input
      type="text"
      id="message"
      placeholder="Message"
      autocomplete="off"
    >

    <button id="sendBtn">
      ➤
    </button>

  </div>

  <script type="module" src="./conversation.js"></script>

</body>
</html>
