<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ChatLive</title>

  <link rel="stylesheet" href="style.css">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #efeae2;
    }

    .chat-page {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ================= HEADER ================= */

    .chat-header {
      height: 65px;
      background: #075E54;
      color: white;

      display: flex;
      align-items: center;

      padding: 7px 10px;
      gap: 9px;

      flex-shrink: 0;
    }

    .back-btn {
      color: white;
      text-decoration: none;
      font-size: 30px;
      padding: 3px;
    }

    #friendPhoto {
      width: 45px;
      height: 45px;

      border-radius: 50%;
      object-fit: cover;

      background: #ddd;
    }

    .friend-info {
      flex: 1;
      min-width: 0;
    }

    #friendName {
      font-size: 18px;
      font-weight: bold;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #friendStatus {
      font-size: 12px;
      margin-top: 2px;
    }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 15px;

      font-size: 21px;
    }

    /* ================= CHAT ================= */

    #messages {
      flex: 1;

      overflow-y: auto;

      padding: 10px;

      background:
        #efeae2;

      display: flex;
      flex-direction: column;
    }

    .message-box {
      max-width: 78%;

      padding: 7px 9px;

      margin: 3px 0;

      border-radius: 10px;

      font-size: 16px;

      word-break: break-word;

      box-shadow:
        0 1px 2px rgba(0,0,0,.15);
    }

    .my-message {
      align-self: flex-end;

      background: #d9fdd3;

      border-bottom-right-radius: 3px;
    }

    .friend-message {
      align-self: flex-start;

      background: white;

      border-bottom-left-radius: 3px;
    }

    .message-image {
      display: block;

      width: 100%;
      max-width: 280px;

      border-radius: 8px;
    }

    .message-time {
      font-size: 10px;

      color: #667
