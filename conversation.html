<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ChatLive</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #efeae2;
    }

    .chat-page {
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 65px;
    }

    /* ================= HEADER ================= */

    .chat-header {
      height: 65px;
      background: #075E54;
      color: white;

      display: flex;
      align-items: center;

      padding: 7px 10px;
      gap: 9px;

      flex-shrink: 0;
    }

    .back-btn {
      color: white;
      text-decoration: none;
      font-size: 32px;
      padding: 3px;
    }

    #friendPhoto {
      width: 45px;
      height: 45px;

      border-radius: 50%;
      object-fit: cover;

      background: #ddd;
    }

    .friend-info {
      flex: 1;
      min-width: 0;
    }

    #friendName {
      font-size: 19px;
      font-weight: bold;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #friendStatus {
      font-size: 12px;
      margin-top: 2px;
    }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 25px;
    }

    /* ================= MESSAGES ================= */

    #messages {
      flex: 1;

      overflow-y: auto;

      padding: 10px;

      background: #efeae2;

      display: flex;
      flex-direction: column;
    }

    .message-box {
      max-width: 78%;

      padding: 8px 10px;

      margin: 4px 0;

      border-radius: 12px;

      font-size: 17px;

      word-break: break-word;

      box-shadow:
        0 1px 2px rgba(0,0,0,.15);
    }

    .my-message {
      align-self: flex-end;

      background: #d9fdd3;

      border-bottom-right-radius: 3px;
    }

    .friend-message {
      align-self: flex-start;

      background: white;

      border-bottom-left-radius: 3px;
    }

    .message-image {
      display: block;

      width: 100%;

      max-width: 300px;

      border-radius: 10px;
    }

    .message-time {
      font-size: 10px;
      color: #667;
      text-align: right;
      margin-top: 4px;
    }

    .ticks {
      font-size: 13px;
      color: #667;
      margin-left: 4px;
    }

    /* ================= COMPOSER ================= */

    .composer {
      position: fixed;

      bottom: 65px;

      left: 0;
      right: 0;

      min-height: 65px;

      background: #f5f5f5;

      padding: 8px 10px;

      display: flex;

      align-items: center;

      gap: 8px;

      border-top: 1px solid #ddd;

      z-index: 1000;
    }

    /* CAMERA */

    .camera-btn {
      width: 48px;
      height: 48px;

      border-radius: 50%;

      background: #075E54;

      color: white;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 25px;

      cursor: pointer;

      flex-shrink: 0;
    }

    /* INPUT */

    #message {
      flex: 1;

      height: 48px;

      min-width: 0;

      border: 1px solid #ddd;

      border-radius: 25px;

      padding: 0 16px;

      font-size: 17px;

      outline: none;

      background: white;
    }

    #message:focus {
      border-color: #075E54;
    }

    /* SEND ARROW */

    #sendBtn {

      width: 52px;
      height: 52px;

      border: none;

      border-radius: 50%;

      background: #128CDB;

      color: white;

      font-size: 27px;

      font-weight: bold;

      display: flex;

      align-items: center;

      justify-content: center;

      cursor: pointer;

      flex-shrink: 0;
    }

    #sendBtn:disabled {
      opacity: .6;
    }

    /* ================= NAVBAR ================= */

    .navbar {
      position: fixed;

      bottom: 0;

      left: 0;
      right: 0;

      height: 65px;

      background: white;

      display: flex;

      justify-content: space-around;

      align-items: center;

      border-top: 1px solid #ddd;

      z-index: 1100;
    }

    .navbar a {
      text-decoration: none;
      font-size: 28px;
    }

  </style>

</head>


<body>


<div class="chat-page">


  <!-- ================= HEADER ================= -->

  <div class="chat-header">

    <a
      href="chat.html"
      class="back-btn"
    >
      ←
    </a>


    <img
      id="friendPhoto"
      src="https://via.placeholder.com/100"
      alt="Profile"
    >


    <div class="friend-info">

      <div id="friendName">
        Loading...
      </div>

      <div id="friendStatus">
        <span style="color:#ccc;">●</span>
        Checking...
      </div>

    </div>


    <div class="header-icons">

      <span>📞</span>

      <span>⋮</span>

    </div>

  </div>


  <!-- ================= MESSAGES ================= -->

  <div id="messages">

  </div>


  <!-- ================= COMPOSER ================= -->

  <div class="composer">


    <!-- CAMERA -->

    <label
      for="chatPhoto"
      class="camera-btn"
    >
      📷
    </label>


    <input
      type="file"
      id="chatPhoto"
      accept="image/*"
      style="display:none;"
    >


    <!-- MESSAGE INPUT -->

    <input
      type="text"
      id="message"
      placeholder="Type a message..."
      autocomplete="off"
    >


    <!-- SEND -->

    <button
      id="sendBtn"
      type="button"
    >
      ➤
    </button>


  </div>


</div>


<!-- ================= NAVBAR ================= -->

<div class="navbar">

  <a href="home.html">🏠</a>

  <a href="post.html">📸</a>

  <a href="chat.html">💬</a>

  <a href="profile.html">👤</a>

</div>


<script
  type="module"
  src="./conversation.js"
></script>


</body>

</html>
