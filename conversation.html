<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ChatLive Chat</title>

  <link rel="stylesheet" href="style.css">


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }


    /* =========================
       CHAT PAGE
    ========================= */

    .chat-page {
      height: 100vh;

      display: flex;
      flex-direction: column;

      padding-bottom: 130px;
    }


    /* =========================
       HEADER
    ========================= */

    .chat-header {
      height: 76px;

      background: #075E54;
      color: white;

      padding: 10px 15px;

      display: flex;
      align-items: center;

      gap: 12px;

      flex-shrink: 0;
    }


    .back-btn {
      font-size: 32px;

      color: white;

      text-decoration: none;

      line-height: 1;

      width: 42px;

      text-align: center;
    }


    #friendPhoto {
      width: 52px;
      height: 52px;

      border-radius: 50%;

      object-fit: cover;

      background: #ddd;

      flex-shrink: 0;
    }


    .friend-info {
      flex: 1;

      min-width: 0;
    }


    #friendName {
      font-size: 21px;

      font-weight: bold;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    #friendStatus {
      height: 12px;

      margin-top: 4px;
    }


    /* =========================
       MESSAGES
    ========================= */

    #messages {
      flex: 1;

      min-height: 0;

      overflow-y: auto;

      padding: 12px 10px 20px;

      display: flex;

      flex-direction: column;

      background: #f5f5f5;
    }


    .message-box {
      max-width: 78%;

      padding: 9px 12px;

      margin: 5px 0;

      border-radius: 15px;

      box-shadow:
        0 1px 3px rgba(0,0,0,.15);

      word-break: break-word;

      font-size: 17px;
    }


    .my-message {
      align-self: flex-end;

      background: #dcf8c6;

      border-bottom-right-radius: 4px;
    }


    .friend-message {
      align-self: flex-start;

      background: white;

      border-bottom-left-radius: 4px;
    }
