<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ChatLive Chat</title>

  <link rel="stylesheet" href="style.css">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .chat-page {
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 65px;
    }

    /* ================= HEADER ================= */

    .chat-header {
      background: #075E54;
      color: white;
      padding: 12px 15px;

      display: flex;
      align-items: center;
      gap: 12px;

      flex-shrink: 0;
    }

    .back-btn {
      font-size: 32px;
      color: white;
      text-decoration: none;
      line-height: 1;
    }

    #friendPhoto {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
    }

    .friend-info {
      flex: 1;
    }

    #friendName {
      font-size: 20px;
      font-weight: bold;
    }

    #friendStatus {
      font-size: 13px;
      margin-top: 3px;
    }

    /* ================= MESSAGES ================= */

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px 10px;

      display: flex;
      flex-direction: column;

      background: #f5f5f5;
    }

    .message-box {
      max-width: 78%;
      padding: 9px 12px;
      margin: 5px 0;

      border-radius: 15px;

      box-shadow:
        0 1px 3px rgba(0,0,0,.15);

      word-break: break-word;
      font-size: 17px;
    }

    .my-message {
      align-self: flex-end;
      background: #dcf8c6;
      border-bottom-right-radius: 4px;
    }

    .friend-message {
      align-self: flex-start;
      background: white;
      border-bottom-left-radius: 4px;
    }

    .message-image {
      width: 100%;
      max-width: 300px;
      border-radius: 12px;
      display: block;
    }

    .message-time {
      font-size: 10px;
      color: #777;
      text-align: right;
      margin-top: 4px;
    }

    .ticks {
      font-size: 12px;
      color: #777;
      margin-left: 3px;
    }

    /* ================= COMPOSER ================= */

    .composer {
      position: fixed;
      bottom: 65px;
      left: 0;
      right: 0;

      background: #fff;

      padding: 8px 10px;

      display: flex;
      align-items: center;
      gap: 8px;

      border-top: 1px solid #ddd;

      z-index: 1000;
    }

    .camera-btn {
      width: 48px;
      height: 48px;

      border-radius: 50%;

      background: #075E54;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 23px;

      cursor: pointer;

      flex-shrink: 0;
    }

    #message {
      flex: 1;

      height: 48px;

      border: 1px solid #ddd;
      border-radius: 25px;

      padding: 0 16px;

      font-size: 17px;

      outline: none;

      background: white;
    }

    #message:focus {
      border-color: #075E54;
    }

    #sendBtn {
      height: 48px;

      min-width: 75px;

      border: none;
      border-radius: 25px;

      background: #128CDB;
      color: white;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;
    }

    #sendBtn:disabled {
      opacity: .6;
    }

    /* ================= NAVBAR ================= */

    .navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;

      height: 65px;

      background: white;

      display: flex;
      justify-content: space-around;
      align-items: center;

      border-top: 1px solid #ddd;

      z-index: 1100;
    }

    .navbar a {
      text-decoration: none;
      font-size: 28px;
    }

  </style>

</head>


<body>

<div class="chat-page">


  <!-- ================= HEADER ================= -->

  <div class="chat-header">

    <a
      href="chat.html"
      class="back-btn"
    >
      ←
    </a>


    <img
      id="friendPhoto"
      src="https://via.placeholder.com/100"
      alt="Profile"
    >


    <div class="friend-info">

      <div id="friendName">
        Loading...
      </div>

      <div id="friendStatus">
        Checking...
      </div>

    </div>

  </div>


  <!-- ================= MESSAGES ================= -->

  <div id="messages"></div>


  <!-- ================= MESSAGE INPUT ================= -->

  <div class="composer">


    <label
      for="chatPhoto"
      class="camera-btn"
    >
      📷
    </label>


    <input
      type="file"
      id="chatPhoto"
      accept="image/*"
      style="display:none;"
    >


    <input
      type="text"
      id="message"
      placeholder="Type a message..."
      autocomplete="off"
    >


    <button
      id="sendBtn"
      type="button"
    >
      Send
    </button>

  </div>


</div>


<!-- ================= NAVBAR ================= -->

<div class="navbar">

  <a href="home.html">🏠</a>

  <a href="post.html">📸</a>

  <a href="chat.html">💬</a>

  <a href="profile.html">👤</a>

</div>


<script
  type="module"
  src="./conversation.js"
></script>


</body>

</html>
