<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ChatLive</title>

  <link rel="stylesheet" href="style.css">

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #efeae2;
    }

    /* =========================
       CHAT PAGE
    ========================= */

    .chat-page {
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 65px;
    }


    /* =========================
       HEADER
    ========================= */

    .chat-header {
      height: 65px;

      background: #075E54;
      color: white;

      display: flex;
      align-items: center;

      padding: 7px 10px;
      gap: 9px;

      flex-shrink: 0;
    }


    .back-btn {
      color: white;
      text-decoration: none;

      font-size: 32px;

      width: 42px;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    #friendPhoto {
      width: 45px;
      height: 45px;

      border-radius: 50%;

      object-fit: cover;

      background: #ddd;

      flex-shrink: 0;
    }


    .friend-info {
      flex: 1;
      min-width: 0;
    }


    #friendName {
      font-size: 20px;
      font-weight: bold;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    #friendStatus {
      font-size: 13px;
      margin-top: 2px;
    }


    .header-icons {
      display: flex;
      align-items: center;

      gap: 18px;

      font-size: 25px;
    }


    .header-icon {
      color: white;
      text-decoration: none;
    }


    /* =========================
       MESSAGES
    ========================= */

    #messages {
      flex: 1;

      overflow-y: auto;

      padding: 12px 10px 90px;

      background: #efeae2;

      display: flex;
      flex-direction: column;
    }


    .message-box {
      max-width: 78%;

      padding: 8px 10px;

      margin: 4px 0;

      border-radius: 12px;

      font-size: 17px;

      word-break: break-word;

      box-shadow:
        0 1px 2px rgba(0,0,0,.15);
    }


    .my-message {
      align-self: flex-end;

      background: #d9fdd3;

      border-bottom-right-radius: 3px;
    }


    .friend-message {
      align-self: flex-start;

      background: white;

      border-bottom-left-radius: 3px;
    }


    .message-image {
      display: block;

      width: 100%;

      max-width: 300px;

      border-radius: 10px;
    }


    .message-time {
      font-size: 10px;

      color: #667781;

      text-align: right;

      margin-top: 4px;
    }


    .ticks {
      font-size: 13px;

      color: #667781;

      margin-left: 3px;
    }


    /* =========================
       COMPOSER
    ========================= */

    .composer {

      position: fixed;

      left: 0;
      right: 0;

      bottom: 65px;

      height: 70px;

      background: #f7f7f7;

      border-top: 1px solid #ddd;

      display: flex;

      align-items: center;

      gap: 10px;

      padding: 8px 12px;

      z-index: 1000;
    }


    /* CAMERA */

    .camera-btn {

      width: 54px;
      height: 54px;

      border-radius: 50%;

      background: #075E54;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 27px;

      cursor: pointer;

      flex-shrink: 0;
    }


    /* MESSAGE INPUT */

    #message {

      flex: 1;

      min-width: 0;

      height: 52px;

      border: 1px solid #ddd;

      border-radius: 28px;

      padding: 0 17px;

      font-size: 17px;

      outline: none;

      background: white;
    }


    #message:focus {

      border-color: #075E54;

    }


    /* SEND */

    #sendBtn {

      width: 58px;
      height: 58px;

      border: none;

      border-radius: 50%;

      background: #128CDB;

      color: white;

      font-size: 25px;

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-shrink: 0;
    }


    #sendBtn:disabled {

      opacity: .6;

    }


    /* =========================
       BOTTOM NAVBAR
    ========================= */

    .navbar {

      position: fixed;

      left: 0;
      right: 0;

      bottom: 0;

      height: 65px;

      background: white;

      display: flex;

      align-items: center;

      justify-content: space-around;

      border-top: 1px solid #ddd;

      z-index: 1100;
    }


    .navbar a {

      text-decoration: none;

      font-size: 29px;

      width: 25%;

      text-align: center;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 500px) {

      .chat-header {
        height: 65px;
      }


      .header-icons {
        gap: 10px;
        font-size: 22px;
      }


      .message-box {
        max-width: 82%;
      }


      #message {
        font-size: 16px;
      }

    }

  </style>

</head>


<body>


  <div class="chat-page">


    <!-- =========================
         HEADER
    ========================= -->

    <div class="chat-header">


      <a
        href="chat.html"
        class="back-btn"
      >
        ←
      </a>


      <img
        id="friendPhoto"
        src="https://via.placeholder.com/100"
        alt="Profile"
      >


      <div class="friend-info">

        <div id="friendName">
          Loading...
        </div>

        <div id="friendStatus">
          Checking...
        </div>

      </div>


      <div class="header-icons">

        <span class="header-icon">
          📞
        </span>

        <span class="header-icon">
          ⋮
        </span>

      </div>

    </div>



    <!-- =========================
         MESSAGES
    ========================= -->

    <div id="messages">

    </div>



    <!-- =========================
         COMPOSER
    ========================= -->

    <div class="composer">


      <!-- CAMERA -->

      <label
        for="chatPhoto"
        class="camera-btn"
      >
        📷
      </label>


      <input
        type="file"
        id="chatPhoto"
        accept="image/*"
        style="display:none;"
      >


      <!-- MESSAGE -->

      <input
        type="text"
        id="message"
        placeholder="Type a message..."
        autocomplete="off"
      >


      <!-- SEND -->

      <button
        id="sendBtn"
        type="button"
      >
        ➤
      </button>


    </div>


  </div>



  <!-- =========================
       BOTTOM NAVBAR
  ========================= -->

  <div class="navbar">


    <a href="home.html">
      🏠
    </a>


    <a href="post.html">
      📸
    </a>


    <a href="chat.html">
      💬
    </a>


    <a href="profile.html">
      👤
    </a>


  </div>



  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script
    type="module"
    src="./conversation.js"
  ></script>


</body>

</html>
