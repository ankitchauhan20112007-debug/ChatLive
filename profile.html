<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ChatLive Profile</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h2>👤 My Profile</h2>
<a
  href="settings.html"
  style="
    display:block;
    text-decoration:none;
    background:#075E54;
    color:white;
    padding:12px;
    border-radius:12px;
    text-align:center;
    margin-bottom:15px;
    font-weight:bold;
  "
>
  ⚙️ Settings
</a>

  <div style="
    background:white;
    padding:20px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  ">

    <img
      id="profilePhoto"
      src="https://via.placeholder.com/120"
      style="
        width:120px;
        height:120px;
        border-radius:50%;
        object-fit:cover;
        display:block;
        margin:auto;
      "
    >

    <br>

    <input
      type="file"
      id="photoInput"
      accept="image/*"
    >

    <br><br>

    <input
      type="text"
      id="nameInput"
      placeholder="Enter your name"
    >

    <br><br>

    <p id="emailText"></p>

    <button id="saveProfile">
      💾 Save Profile
    </button>

    <p id="msg"></p>

  </div>

</div>


<div class="navbar">

  <a href="home.html">🏠</a>

  <a href="post.html">📸</a>

  <a href="chat.html">💬</a>

  <a href="profile.html">👤</a>

</div>


<script type="module" src="profile.js"></script>

</body>
</html>
