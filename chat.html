<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatLive Chat</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

</div>

<script type="module" src="chat.js"></script>

</body>
</html>
