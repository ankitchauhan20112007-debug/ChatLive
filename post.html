
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatLive - Create</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h2>📸 Create Post / Story</h2>

<div id="posts"></div>

</div>

<script type="module" src="post.js"></script>

</body>
</html>
